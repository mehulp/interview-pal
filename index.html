<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InterviewPal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>InterviewPal</h1>
  </header>

  <main class="app-main">
    <!-- Placeholder avatar: a simple SVG face. Real states come in build step 2. -->
    <section class="avatar-panel" aria-label="Interviewer">
      <div id="avatar"></div>
      <p class="caption" aria-live="polite">Hello! Questions will appear here as captions.</p>

      <!-- Test control: switch the avatar state by hand (temporary, for development) -->
      <div class="state-test" role="group" aria-label="Avatar state test">
        <button type="button" data-state="idle" aria-pressed="true">Idle</button>
        <button type="button" data-state="talking" aria-pressed="false">Talking</button>
        <button type="button" data-state="listening" aria-pressed="false">Listening</button>
      </div>
    </section>

    <section class="controls" aria-label="Answer controls">
      <textarea placeholder="Type your answer here (always available)" rows="4"></textarea>
      <div class="buttons">
        <button type="button" class="big">🎤 Answer</button>
        <button type="button" class="big">Next</button>
      </div>
    </section>
  </main>

  <script type="module" src="src/ui.js"></script>
</body>
</html>
